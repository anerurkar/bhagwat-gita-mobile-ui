<!-- Spiritual Header -->
<div class="spiritual-header">
  <div class="om-symbol">🕉️</div>

  <div class="chapter-pill">
    Chapter {{ chapterId }}
  </div>

  <div class="header-title">
    Sacred Shloka
  </div>
</div>

  <!-- Loading -->
  <div *ngIf="loading" class="status-text">
    Loading shloka…
  </div>

  <!-- Shloka Card -->
  <div *ngIf="!loading && shloka" class="shloka-card">

    <!-- Shloka Indicator -->
    <div class="shloka-indicator">
      Shloka {{ shloka.number }} / {{ totalShlokas }}
    </div>

    <div class="divider"></div>

    <!-- Sanskrit Text -->
    <p class="sanskrit-text">
      {{ shloka.sanskrit }}
    </p>

    <!-- Meaning -->
    <p class="meaning-text">
      {{ shloka.meaning }}
    </p>

    <!-- Practical Guidance -->
    <div class="guidance-box">
      <div class="guidance-title">Practical Guidance</div>
      <p class="guidance-text">
        {{ shloka.guidance }}
      </p>
    </div>

    <div class="divider"></div>

    <!-- Audio Button -->
    <div class="audio-box">
      <button (click)="playAudio()">
        🔊 Play Chant & Meaning
      </button>
    </div>
	
<app-bookmark
  [chapter]="chapterId"
  [shloka]="shlokaNo">
</app-bookmark>


    <!-- Shloka Navigation -->
    <div class="shloka-nav">
      <button (click)="prevShloka()" [disabled]="shlokaNo === 1">
        ◀ Prev Shloka
      </button>

      <button (click)="nextShloka()" [disabled]="shlokaNo === totalShlokas">
        Next Shloka ▶
      </button>
    </div>

    <!-- Chapter Navigation -->
    <div class="chapter-nav">
      <button (click)="prevChapter()" [disabled]="chapterId === 1">
        ⟨ Previous Chapter ⟩
      </button>
      <button (click)="nextChapter()" [disabled]="chapterId === 18">
        ⟨ Next Chapter ⟩
      </button>
    </div>

  </div>
</div>
