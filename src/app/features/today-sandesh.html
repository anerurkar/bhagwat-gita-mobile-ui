<div class="home-page">

  <div class="home-content">

    <!-- Header -->
    <div class="home-header">
      <div class="app-icon">🕉️</div>
      <h1 class="app-title">Bhagavad Gita</h1>
      <p class="app-subtitle">Sacred Wisdom for Daily Life</p>
    </div>

    <!-- Today's Sandesh -->
    <div class="sandesh-section">
      <h2 class="section-title">Today’s Sandesh</h2>

      <div class="sandesh-card">
        <p class="sandesh-sanskrit">
          कर्मण्येवाधिकारस्ते मा फलेषु कदाचन
        </p>
        <p class="sandesh-meaning">
          You have the right to perform your duty, but not to the fruits of action.
        </p>
      </div>
    </div>

    <!-- Action -->
    <a class="primary-action" [routerLink]="['/chapters']">
      Explore Chapters
    </a>

  </div>

</div>
